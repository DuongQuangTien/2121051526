<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            justify-content: center;
            text-align: center;
            display: flex;
        }
    </style>
</head>

<body>
    <div class="anh-sang">
        <h2>Ví dị về chế độ</h2>
        <div class="content">
            <img src="abc.jpg" alt="" width=200px;>
        </div>
        <h2>Chế độ:Sáng</h2>
        <div class="cuoi">
            <button onclick="doiCheDo()">Đổi chế độ</button>
        </div>
    </div>
    <script>
        let cheDo = true;
        function doiCheDo() {
            if (cheDo == true) {
                document.getElementsByTagName('body')[0].style = 'background-color: white   ';
                document.getElementsByTagName('h2')[0].style = 'Chế độ : tối';
                document.getElementsByTagName('h2')[0].style = 'color: black';
                document.getElementsByTagName('h2')[0].style = 'color: black';
                document.getElementsByTagName('img')[0].src = 'abc.jpg';
                cheDo = false;
            }
            else {
                document.getElementsByTagName('body')[0].style = 'background-color: white';
                document.getElementsByTagName('h2')[1]  .innerHTML = 'Chế độ : Sáng';
                document.getElementsByTagName('h2')[0].style = 'color: black';
                document.getElementsByTagName('h2')[1].style = 'color: black';
                document.getElementsByTagName('img')[0].src = 'abcc.jpg';
                cheDo = true;
            }   
        }
    </script>
</body>

</html>
