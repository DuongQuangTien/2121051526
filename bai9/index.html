       let mode = prompt("Mời bạn nhập số:"); // abc

        function check(mode) {
            if (mode % 2 == 0) {
                document.write(mode + " là số chẵn");
            } else {
                document.write(mode + " là số lẻ");
            }
        }

        //mode (abc) is not a number (true)
        if (!isNaN(mode)) {
            mode = parseFloat(mode);
            check(mode);
        }
        else {
            document.writeln("Vui lòng nhập vào số!");
